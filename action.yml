name: 'Kobe Cluster'
description: 'Claim a Kubernetes cluster from a Kobe pool. Auto-releases on job exit.'
branding:
  icon: 'server'
  color: 'blue'

inputs:
  endpoint:
    description: 'Kobe API endpoint URL'
    required: true
  pool:
    description: 'Pool name to claim from (e.g. ci-small)'
    required: true
  ttl:
    description: 'Lease TTL (e.g. 1h, 30m)'
    required: false
    default: '1h'
  audience:
    description: 'OIDC token audience'
    required: false
    default: 'kobe-system'
  timeout:
    description: 'Max time to wait for cluster to be ready (e.g. 5m)'
    required: false
    default: '5m'

outputs:
  kubeconfig-path:
    description: 'Path to the kubeconfig file'
  lease-id:
    description: 'Lease ID'
  cluster-name:
    description: 'Name of the claimed cluster'

runs:
  using: 'node20'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
